<!DOCTYPE html>
<!--
  作者：王治贤
  建立时间：2026-11-11
  使用大模型：Trae AI
  功能名称：Swiper cube 效果自动轮播演示页
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swiper cube 效果自动轮播演示</title>
<!-- Swiper 组件库 CDN 引入 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#f6f8fc;color:#1f2937}
  .wrap{max-width:760px;margin:0 auto;padding:50px 20px 60px}
  h1{font-size:24px;color:#0f2b5b;margin-bottom:24px}
  /* 轮播容器：cube 是 3D 效果，需要给容器留出透视空间 */
  .swiper{width:100%;height:340px;border-radius:16px}
  .swiper-slide img{width:100%;height:100%;object-fit:cover;display:block;border-radius:16px}
  /* 分页圆点配色 */
  .swiper-pagination-bullet{background:#0f2b5b;opacity:.35}
  .swiper-pagination-bullet-active{background:#e8890c;opacity:1;width:22px;border-radius:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Swiper · cube 3D 立方体自动轮播</h1>

  <!-- 轮播骨架：container > wrapper > slide，外加分页圆点容器 -->
  <div class="swiper" id="wySw4">
    <div class="swiper-wrapper">
      <div class="swiper-slide"><img src="swiper-imgs/tiangong_1.jpg" alt="天宫空间站"></div>
      <div class="swiper-slide"><img src="swiper-imgs/fuxing_1.jpg" alt="复兴号动车组"></div>
      <div class="swiper-slide"><img src="swiper-imgs/c919_1.jpg" alt="C919大飞机"></div>
    </div>
    <div class="swiper-pagination"></div>
  </div>
</div>

<script>
  // 初始化 #wySw4：cube 3D 立方体效果 + 无缝循环 + 自动轮播 + 圆点分页
  var wySw4 = new Swiper('#wySw4', {
    loop: true,                              // 1. 无缝循环
    effect: 'cube',                          // 4. 固定 cube 效果
    cubeEffect: {
      slideShadows: true,                    // 幻灯片投影
      shadow: true,                          // 容器整体投影
      shadowOffset: 30,                      // 投影偏移量
      shadowScale: 0.9                       // 投影缩放比例
    },
    autoplay: {
      delay: 3200,                           // 2. 每 3200ms 自动翻页
      disableOnInteraction: false            // 2. 手动滑动之后自动翻页不会停止
    },
    pagination: {
      el: '.swiper-pagination',              // 3. 圆点分页器
      clickable: true                        // 3. 圆点可以点击切换
    }
  });
</script>
</body>
</html>
