<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQ音乐复刻-歌曲详情</title>
    <link rel="stylesheet" href="font/iconfont.css">

<body>
    <div class="wzx-container">
        <div class="wzx-back" onclick="history.back()">← 返回</div>
        <div class="wzx-detail-wrap"></div>
        <button class="wzx-btn wzx-play-btn">▶ 播放歌曲</button>
        <div class="wzx-lyric"></div>
    </div>

    <!-- 播放弹窗 -->

            <div class="wzx-control">
                <button class="wzx-btn wzx-prev-btn">上一曲</button>
                <button class="wzx-btn wzx-toggle-btn">暂停</button>
                <button class="wzx-btn wzx-next-btn">下一曲</button>
            </div>
            <button class="wzx-close-popup">关闭</button>
        </div>
    </div>

    <script src="js/wzx-data.js"></script>
