<!DOCTYPE html>
<!--
  作者：24002120606王治贤
  建立时间：2026-11-20
  使用大模型：Trae AI
  功能名称：移动端交互汇总页（iframe 内嵌手势滑动/双指缩放/摇一摇三个页面）
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>移动端交互 - 三个演示页汇总</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: #171722;
      min-height: 100vh;
      padding: 30px 16px 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wzx_page-title {
      color: #fff;
      font-size: 24px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .wzx_page-desc {
      color: #8a84a0;
      font-size: 13px;
      margin-bottom: 34px;
    }

    /* 每个演示项：标题 + iframe */
    .wzx_demo-item {
      width: 100%;
      max-width: 460px;
      margin-bottom: 40px;
    }

    .wzx_demo-title {
      color: #f5d000;
      font-size: 17px;
      margin-bottom: 12px;
      padding-left: 10px;
      border-left: 3px solid #f5d000;
    }

    /* 内嵌的三个移动端页面 */
    .wzx_demo-frame {
      width: 100%;
      height: 820px;
      border: 1px solid #2e2645;
      border-radius: 14px;
      background: #000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }

    .wzx_back-link {
      color: #5b8cff;
      font-size: 14px;
      text-decoration: none;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h1 class="wzx_page-title">📱 移动端交互汇总</h1>
  <p class="wzx_page-desc">以下三个页面均通过 iframe 内嵌展示，可直接在框内操作</p>

  <!-- 演示一：手势滑动美食卡片 -->
  <div class="wzx_demo-item">
    <p class="wzx_demo-title">演示一 · 手势滑动切换美食卡片</p>
    <iframe class="wzx_demo-frame" src="mobile-gesture.html" title="手势滑动美食卡片" loading="lazy"></iframe>
  </div>

  <!-- 演示二：双指缩放图片查看器 -->
  <div class="wzx_demo-item">
    <p class="wzx_demo-title">演示二 · 双指缩放图片查看器</p>
    <iframe class="wzx_demo-frame" src="mobile-zoom.html" title="双指缩放图片查看器" loading="lazy"></iframe>
  </div>

  <!-- 演示三：摇一摇抽菜谱 -->
  <div class="wzx_demo-item">
    <p class="wzx_demo-title">演示三 · 摇一摇抽今日菜谱</p>
    <iframe class="wzx_demo-frame" src="mobile-sensor.html" title="摇一摇抽菜谱" loading="lazy"></iframe>
  </div>

  <a class="wzx_back-link" href="index.html">返回首页</a>
</body>
</html>
