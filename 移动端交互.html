<!DOCTYPE html>
<!--
  作者：24002120606王治贤
  建立时间：2026-11-20
  使用大模型：Trae AI
  功能名称：移动端交互汇总页（卡片式内嵌手势滑动/双指缩放/摇一摇三个页面，含跳转按钮）
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>移动端交互 - 三个演示页汇总</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: #171722;
      min-height: 100vh;
      padding: 30px 16px 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wzx_page-title {
      color: #fff;
      font-size: 24px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .wzx_page-desc {
      color: #8a84a0;
      font-size: 13px;
      margin-bottom: 34px;
    }

    /* 演示卡片：标题栏 + 内嵌页面 + 底部跳转按钮 */
    .wzx_demo-card {
      width: 100%;
      max-width: 460px;
      margin-bottom: 40px;
      border: 1px solid #2e2645;
      border-radius: 14px;
      background: #1e182c;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .wzx_card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #2e2645;
    }

    .wzx_card-title {
      color: #f5d000;
      font-size: 16px;
      padding-left: 10px;
      border-left: 3px solid #f5d000;
    }

    .wzx_card-tag {
      color: #8a84a0;
      font-size: 12px;
    }

    /* 内嵌的移动端页面 */
    .wzx_demo-frame {
      width: 100%;
      height: 780px;
      border: none;
      background: #000;
      display: block;
    }

    /* 卡片底部操作栏与跳转按钮 */
    .wzx_card-footer {
      display: flex;
      justify-content: flex-end;
      padding: 12px 16px;
      border-top: 1px solid #2e2645;
    }

    .wzx_jump-btn {
      display: inline-block;
      padding: 8px 22px;
      font-size: 14px;
      color: #fff;
      background: linear-gradient(135deg, #ff512f, #dd2476);
      border: none;
      border-radius: 20px;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .wzx_jump-btn:hover {
      opacity: 0.85;
    }

    .wzx_back-link {
      color: #5b8cff;
      font-size: 14px;
      text-decoration: none;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h1 class="wzx_page-title">📱 移动端交互汇总</h1>
  <p class="wzx_page-desc">以下三个页面以卡片形式内嵌展示，可在框内直接操作，或点击按钮跳转到独立页面</p>

  <!-- 卡片一：手势滑动美食卡片 -->
  <div class="wzx_demo-card">
    <div class="wzx_card-header">
      <p class="wzx_card-title">演示一 · 手势滑动切换美食卡片</p>
      <span class="wzx_card-tag">touch 手势</span>
    </div>
    <iframe class="wzx_demo-frame" src="mobile-gesture.html" title="手势滑动美食卡片" loading="lazy"></iframe>
    <div class="wzx_card-footer">
      <a class="wzx_jump-btn" href="mobile-gesture.html" target="_blank">跳转页面 →</a>
    </div>
  </div>

  <!-- 卡片二：双指缩放图片查看器 -->
  <div class="wzx_demo-card">
    <div class="wzx_card-header">
      <p class="wzx_card-title">演示二 · 双指缩放图片查看器</p>
      <span class="wzx_card-tag">捏合缩放</span>
    </div>
    <iframe class="wzx_demo-frame" src="mobile-zoom.html" title="双指缩放图片查看器" loading="lazy"></iframe>
    <div class="wzx_card-footer">
      <a class="wzx_jump-btn" href="mobile-zoom.html" target="_blank">跳转页面 →</a>
    </div>
  </div>

  <!-- 卡片三：摇一摇抽菜谱 -->
  <div class="wzx_demo-card">
    <div class="wzx_card-header">
      <p class="wzx_card-title">演示三 · 摇一摇抽今日菜谱</p>
      <span class="wzx_card-tag">devicemotion</span>
    </div>
    <iframe class="wzx_demo-frame" src="mobile-sensor.html" title="摇一摇抽菜谱" loading="lazy"></iframe>
    <div class="wzx_card-footer">
      <a class="wzx_jump-btn" href="mobile-sensor.html" target="_blank">跳转页面 →</a>
    </div>
  </div>

  <a class="wzx_back-link" href="index.html">返回首页</a>
</body>
</html>
